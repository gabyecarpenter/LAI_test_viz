<script>
  window.loadGeoTiff = function(filename) {
    if (!filename) return;
    
    let bucketUrl = '[https://storage.googleapis.com/ncrmp-atlantic-photos/MIR/](https://storage.googleapis.com/ncrmp-atlantic-photos/MIR/)';
    let fullImageUrl = bucketUrl + filename;
    
    let statusEl = document.getElementById('photo_status');
    let progressContainer = document.getElementById('progress_container');
    let progressBar = document.getElementById('progress_bar');
    let progressText = document.getElementById('progress_text');
    let canvas = document.getElementById('tiff_canvas');
    let ctx = canvas.getContext('2d');
    
    // Reveal Progress Bar UI immediately
    progressContainer.style.display = 'block';
    progressBar.style.width = '0%';
    progressText.innerText = '0%';
    statusEl.innerHTML = '⚡ Fetching GeoTIFF: <b>' + filename + '</b>...';
    
    // Clear previous drawing
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Stream array buffer via XHR
    let xhr = new XMLHttpRequest();
    xhr.open('GET', fullImageUrl, true);
    xhr.responseType = 'arraybuffer';
    
    xhr.onprogress = function(event) {
      if (event.lengthComputable) {
        let percentComplete = Math.round((event.loaded / event.total) * 100);
        progressBar.style.width = percentComplete + '%';
        progressText.innerText = percentComplete + '%';
        
        if (percentComplete === 100) {
          statusEl.innerHTML = '⚙️ Processing pixel arrays for <b>' + filename + '</b>...';
        }
      } else {
        statusEl.innerHTML = '⚡ Downloading GeoTIFF...';
      }
    };
    
    xhr.onload = async function() {
      if (xhr.status === 200) {
        try {
          let arrayBuffer = xhr.response;
          const tiff = await GeoTIFF.fromArrayBuffer(arrayBuffer);
          const image = await tiff.getImage();
          const width = image.getWidth();
          const height = image.getHeight();
          
          const rasters = await image.readRasters();
          
          canvas.width = width;
          canvas.height = height;
          
          const imgData = ctx.createImageData(width, height);
          const data = imgData.data;
          
          for (let i = 0; i < rasters[0].length; i++) {
            let val = rasters[0][i];
            let idx = i * 4;
            data[idx]     = rasters[0][i];
            data[idx + 1] = rasters[1] ? rasters[1][i] : val;
            data[idx + 2] = rasters[2] ? rasters[2][i] : val;
            data[idx + 3] = 255;
          }
          
          ctx.putImageData(imgData, 0, 0);
          statusEl.innerHTML = '✅ Active Photo: <b>' + filename + '</b>';
          
          setTimeout(() => { progressContainer.style.display = 'none'; }, 1000);
          
        } catch (err) {
          console.error(err);
          statusEl.innerHTML = '<span style="color:red;">Error parsing TIFF pixel buffer.</span>';
        }
      } else {
        statusEl.innerHTML = '<span style="color:red;">HTTP Error ' + xhr.status + ': File missing or CORS restricted on GCS.</span>';
      }
    };
    
    xhr.onerror = function() {
      statusEl.innerHTML = '<span style="color:red;">Network error or CORS restriction on Google Cloud Storage.</span>';
    };
    
    xhr.send();
  };
  
  // Also catch direct marker clicks if popup is closed
  document.addEventListener('DOMContentLoaded', function() {
    let checkMap = setInterval(function() {
      let mainMapWidget = HTMLWidgets.find('#main_map');
      if (!mainMapWidget) return;
      clearInterval(checkMap);
      let map = mainMapWidget.getMap();
      map.on('layerclick', function(e) {
        if (e.layer && e.layer.options && e.layer.options.layerId) {
          window.loadGeoTiff(e.layer.options.layerId);
        }
      });
    }, 400);
  });
</script>

    const processXRef = (id, note) => {
      // Strip column container classes
      const stripColumnClz = (el) => {
        el.classList.remove("page-full", "page-columns");
        if (el.children) {
          for (const child of el.children) {
            stripColumnClz(child);
          }
        }
      }
      stripColumnClz(note)
      if (id === null || id.startsWith('sec-')) {
        // Special case sections, only their first couple elements
        const container = document.createElement("div");
        if (note.children && note.children.length > 2) {
          container.appendChild(note.children[0].cloneNode(true));
          for (let i = 1; i < note.children.length; i++) {
            const child = note.children[i];
            if (child.tagName === "P" && child.innerText === "") {
              continue;
            } else {
              container.appendChild(child.cloneNode(true));
              break;
            }
          }
          if (window.Quarto?.typesetMath) {
            window.Quarto.typesetMath(container);
          }
          return container.innerHTML
        } else {
          if (window.Quarto?.typesetMath) {
            window.Quarto.typesetMath(note);
          }
          return note.innerHTML;
        }
      } else {
        // Remove any anchor links if they are present
        const anchorLink = note.querySelector('a.anchorjs-link');
        if (anchorLink) {
          anchorLink.remove();
        }
        if (window.Quarto?.typesetMath) {
          window.Quarto.typesetMath(note);
        }
        if (note.classList.contains("callout")) {
          return note.outerHTML;
        } else {

    for (var i=0; i<xrefs.length; i++) {
      const xref = xrefs[i];

        let url = xref.getAttribute('href');
        let hash = undefined; 
        if (url.startsWith('#')) {
          hash = url;
        } else {
          try { hash = new URL(url).hash; } catch {}
        }
        if (hash) {
          const id = hash.replace(/^#\/?/, "");
          const note = window.document.getElementById(id);
          if (note !== null) {
            try {
              const html = processXRef(id, note.cloneNode(true));
              instance.setContent(html);
            } finally {
              instance.enable();
              instance.show();
            }
          } else {
            // See if we can fetch this
            fetch(url.split('#')[0])
            .then(res => res.text())
            .then(html => {
              const parser = new DOMParser();
              const htmlDoc = parser.parseFromString(html, "text/html");
              const note = htmlDoc.getElementById(id);
              if (note !== null) {
                const html = processXRef(id, note);
                instance.setContent(html);
              } 
            }).finally(() => {
              instance.enable();
              instance.show();
            });
          }
        } else {
          // See if we can fetch a full url (with no hash to target)
          // This is a special case and we should probably do some content thinning / targeting
          fetch(url)
          .then(res => res.text())
          .then(html => {
            const parser = new DOMParser();
            const htmlDoc = parser.parseFromString(html, "text/html");
            const note = htmlDoc.querySelector('main.content');
            if (note !== null) {
              // This should only happen for chapter cross references
              // (since there is no id in the URL)
              // remove the first header
              if (note.children.length > 0 && note.children[0].tagName === "HEADER") {
                note.children[0].remove();
              }
              const html = processXRef(null, note);
              instance.setContent(html);
            } 
          }).finally(() => {
            instance.enable();
            instance.show();
          });
        }
      }, function(instance) {
      });
    }

      );
      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
                timer = throttle = false;
              }, ms);
          }
        };
      }
        // Attach click handler to the DT
        const annoteDls = window.document.querySelectorAll('dt[data-target-cell]');
        for (const annoteDlNode of annoteDls) {
          annoteDlNode.addEventListener('click', (event) => {
            const clickedEl = event.target;
